<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project BRAHMA — Universal Intelligence Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--bg2:#eae3d5;--ink:#141a45;--mute:#4b5077;--gold:#b87400;--teal:#0d7f74;--line:#141a4522;--card:#fbf8f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1233;--bg2:#141a45;--ink:#f0e8d8;--mute:#a9adcf;--gold:#f5b21a;--teal:#39c5b4;--line:#f0e8d824;--card:#171d4d}}
:root[data-theme="dark"]{--bg:#0e1233;--bg2:#141a45;--ink:#f0e8d8;--mute:#a9adcf;--gold:#f5b21a;--teal:#39c5b4;--line:#f0e8d824;--card:#171d4d}
html{scroll-padding-top:56px;scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.7 Hind,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Tiro Devanagari Hindi",Georgia,serif;font-weight:400;line-height:1.15}
a{color:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:16px;height:56px}
nav b{font:400 22px "Tiro Devanagari Hindi",serif;color:var(--gold);flex:none}
nav .links{display:flex;gap:14px;font-size:15px;overflow-x:auto;white-space:nowrap}
nav button{all:unset;cursor:pointer;color:var(--mute);font-size:15px}
nav button:hover,nav button.on{color:var(--gold)}
nav a.ext{color:var(--mute);text-decoration:none;flex:none}
.langsw{display:flex;gap:2px;background:var(--bg2);border-radius:99px;padding:2px;flex:none;margin-left:auto}
.langsw button{all:unset;cursor:pointer;font-size:13px;padding:5px 11px;border-radius:99px;color:var(--mute)}
.langsw button.on{background:var(--gold);color:#141a45;font-weight:600}
.page{display:none;animation:f .25s}
.page.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{padding:52px 0 26px}.ph code{font:500 16px "Spline Sans Mono",monospace;color:var(--teal)}
.ph h1{font-size:clamp(38px,7vw,68px);color:var(--gold)}
.ph p{color:var(--mute);max-width:60ch;margin-top:12px}
section.blk{padding:38px 0;border-top:1px solid var(--line)}
.page>.hero+.blk,.page>.wrap+.blk{border-top:0}
h2{font-size:clamp(24px,4vw,34px);margin-bottom:8px}.lead{color:var(--mute);max-width:62ch;margin-bottom:22px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
button.c,a.c{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
button.c:hover,a.c:hover{border-color:var(--gold)}
.c h3{font-size:19px;margin-bottom:4px}.c code{font:500 13px "Spline Sans Mono",monospace;color:var(--teal)}
.c p,.c li{color:var(--mute);font-size:15px;line-height:1.55}.c ul{padding-left:18px;margin-top:6px}
.tag{display:inline-block;margin-top:10px;font-size:12px;color:var(--teal);border:1px solid var(--teal);border-radius:99px;padding:0 10px}
.tag.a{color:var(--gold);border-color:var(--gold)}
.flow{display:flex;flex-wrap:wrap;margin:6px 0 22px}
.flow span{padding:8px 16px;background:var(--bg2);border:1px solid var(--line);font-size:15px;margin:0 -1px -1px 0}
pre{background:#0a0e2b;color:#f0e8d8;padding:16px 18px;border-radius:12px;overflow-x:auto;font:400 14px/1.7 "Spline Sans Mono",monospace}
.bar{margin-bottom:14px;font-size:16px}.bar b{float:right;font-weight:500}
.bar div{clear:both;height:8px;background:var(--bg2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}
.hero{padding:50px 0 30px}.hero .inner{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center}
.hero h1{font-size:clamp(56px,10vw,110px);color:var(--gold)}
.hero h1 small{display:block;font-size:.22em;color:var(--ink);margin-top:8px}
.hero p{color:var(--mute);max-width:46ch;margin:16px 0}
.btn{display:inline-block;padding:10px 22px;border:1px solid var(--gold);border-radius:99px;text-decoration:none;font-weight:600;font-size:16px;margin-right:10px;cursor:pointer;background:none;color:var(--ink)}
.btn.p{background:var(--gold);color:#141a45}
.mandala{width:100%;max-width:400px;justify-self:center}.mandala text{font:11px Hind,sans-serif;fill:var(--ink)}
.node{cursor:pointer}.node circle{fill:var(--bg2);stroke:var(--line);stroke-width:1.5;transition:.3s}.node.on circle{fill:var(--gold);stroke:var(--gold)}.node.on text{fill:#141a45}
.ring{fill:none;stroke:var(--line)}
.stage{text-align:center;min-height:90px}.stage h3{font-size:22px;color:var(--gold)}.stage p{color:var(--mute);font-size:16px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--mute);font-weight:600}tr:last-child td{border-bottom:0}
.who{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.mile{background:var(--bg2);border-radius:18px;padding:30px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.mile .d{font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(38px,7vw,70px);color:var(--gold);line-height:1;text-align:center}
.mile .d small{display:block;font-size:15px;color:var(--mute);font-family:Hind,sans-serif}
.stat{text-align:center}.stat h3{font-size:28px;color:var(--gold);margin-bottom:2px}.stat p{margin:0}
footer{padding:34px 0;border-top:1px solid var(--line);color:var(--mute);font-size:15px;text-align:center}
@media (max-width:760px){.hero .inner,.who,.mile{grid-template-columns:1fr}nav .wrap{flex-wrap:wrap;height:auto;padding:8px 22px}nav .links{order:3;width:100%}}
</style>
</head>

<script>
var GH="https://github.com/ramendrarajput/Indian-AI-Research-Lab";
var LANG=(localStorage.getItem("brahma_lang")||"hi");
function t(hi,en){return LANG==="hi"?hi:en}

var PAGES=[["home",{hi:"Home",en:"Home"}],["research",{hi:"Research",en:"Research"}],["engineering",{hi:"Engineering",en:"Engineering"}],["public",{hi:"Public",en:"Public"}],["archive",{hi:"Archive",en:"Archive"}],["docs",{hi:"Docs",en:"Docs"}],["requirements",{hi:"Requirements",en:"Requirements"}],["founder",{hi:"Founder",en:"Founder"}]];

function card(title,p,opts){opts=opts||{};var h="";
 if(opts.code)h+="<code>"+opts.code+"</code>";
 h+="<h3>"+title+"</h3>";
 if(p)h+="<p>"+p+"</p>";
 if(opts.li)h+="<ul>"+opts.li.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>";
 if(opts.tag)h+='<span class="tag'+(opts.tag=="Active"?" a":"")+'">'+opts.tag+"</span>";
 if(opts.go)return '<button class="c" onclick="go(\''+opts.go+'\')">'+h+"</button>";
 if(opts.href)return '<a class="c" href="'+opts.href+'" target="_blank" rel="noopener">'+h+"</a>";
 return '<div class="c">'+h+"</div>";
}
function grid(a){return '<div class="g">'+a.join("")+"</div>"}
function flow(a){return '<div class="flow">'+a.map(function(x){return "<span>"+x+"</span>"}).join("")+"</div>"}
function blk(title,lead,body){return '<section class="blk"><div class="wrap"><h2>'+title+'</h2><p class="lead">'+lead+'</p>'+body+'</div></section>'}
function ph(code,title,p){return '<header class="ph"><div class="wrap"><code>'+code+'</code><h1>'+title+'</h1><p>'+p+'</p></div></header>'}

function buildContent(){
var CONTENT={};

["engineering","ENGINEERING/",t("Universal Runtime, core engine, laboratories, infrastructure.","Universal Runtime, core engine, laboratories, infrastructure.")],
["public","PUBLIC/",t("Stable releases, APIs, SDKs, documentation.","Stable releases, APIs, SDKs, documentation.")],

CONTENT.home=
'<header class="hero"><div class="wrap inner">'+
'<div><h1>BRAHMA<small>'+t("Bharat Research Architecture for Holistic Multidisciplinary Advancement","Bharat Research Architecture for Holistic Multidisciplinary Advancement")+'</small></h1>'+
'<p>'+t('Ek chatbot nahi, ek Universal Intelligence Architecture — research, engineering aur alag-alag scientific fields ek hi cognitive runtime par. "How should intelligence itself be architected?" — yahi sawaal is repository ke har module, laboratory aur engineering decision ke peeche hai. Yahan intelligence koi product feature nahi, ek scientific discipline ki tarah engineer ki jaati hai.','Not a chatbot, but a Universal Intelligence Architecture — research, engineering, and distinct scientific fields running on a single cognitive runtime. "How should intelligence itself be architected?" — this is the question behind every module, laboratory, and engineering decision in this repository. Here, intelligence is not a product feature; it is engineered as a scientific discipline.')+'</p>'+
'<button class="btn p" onclick="go(\'engineering\')">'+t("Architecture dekhein","Explore the architecture")+'</button><a class="btn" href="'+GH+'" target="_blank" rel="noopener">GitHub</a></div>'+
'<svg class="mandala" viewBox="0 0 400 400" role="img" aria-label="BRAHMA cognitive cycle" id="m"><circle class="ring" cx="200" cy="200" r="150"/><circle class="ring" cx="200" cy="200" r="100" stroke-dasharray="3 6"/><text x="200" y="208" text-anchor="middle" style="font:34px \'Tiro Devanagari Hindi\',serif;fill:var(--gold)">ॐ</text></svg>'+
'</div></header><div class="wrap"><div class="stage" id="stage" aria-live="polite"></div>'+
'<div class="g" style="margin-top:22px">'+stats.map(function(s){return '<div class="c stat"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'}).join("")+'</div></div>'+
blk(t("Kya hai Project BRAHMA","What is Project BRAHMA"),t("Ek naye tarah ka scientific-engineering initiative, jo India se ek software product ki tarah nahi, ek research architecture ki tarah shuru hua hai.","A new kind of scientific-engineering initiative, started from India not as a software product but as a research architecture."),
 '<p class="lead">'+t('BRAHMA ka maqsad ek aur AI chatbot ya AI product banana nahi hai. Ye ek <b style="color:var(--ink)">Universal Intelligence Runtime</b> banane ka prayas hai — ek aisa cognitive architecture jispar Artificial Intelligence, Quantum Computing, Physics, Biology, Mathematics, Robotics aur Finance jaisi alag-alag scientific disciplines ek hi shared runtime, memory aur reasoning engine par kaam kar sakein.','BRAHMA\'s purpose is not to build another AI chatbot or AI product. It is an effort to build a <b style="color:var(--ink)">Universal Intelligence Runtime</b> — a cognitive architecture on which distinct scientific disciplines like Artificial Intelligence, Quantum Computing, Physics, Biology, Mathematics, Robotics, and Finance can operate on one shared runtime, memory, and reasoning engine.')+'</p>'+
 '<p class="lead" style="margin-top:14px">'+t("Repository khud ek jeevit architecture ki tarah design hui hai — har idea Research se shuru hokar Engineering, Runtime, Laboratories, Applications, Public Systems aur Archive tak ek fixed lifecycle se guzarta hai. Kuch bhi jaldi mein nahi likha jaata; har architectural decision pehle document hota hai, phir implement.","The repository itself is designed as a living architecture — every idea passes through a fixed lifecycle, starting at Research and moving through Engineering, Runtime, Laboratories, Applications, Public Systems, and Archive. Nothing is written in haste; every architectural decision is documented before it is implemented.")+'</p>')+
blk(t("Sirf chatbot nahi, poora platform","Not just a chatbot — an entire platform"),t("Traditional AI projects ek problem solve karte hain. BRAHMA wo architecture banata hai jisme intelligent systems saath rehkar evolve ho sakein.","Traditional AI projects solve one problem. BRAHMA builds the architecture in which intelligent systems can evolve together."),
 '<table><tr><th>'+t("Traditional AI Projects","Traditional AI Projects")+'</th><th>Project BRAHMA</th></tr>'+
 [[t("Single chatbot","Single chatbot"),t("Universal Intelligence Runtime","Universal Intelligence Runtime")],
  [t("One application","One application"),t("Multiple Scientific Laboratories","Multiple Scientific Laboratories")],
  [t("Fixed workflow","Fixed workflow"),t("Cognitive Architecture","Cognitive Architecture")],
  [t("Independent modules","Independent modules"),t("Shared Runtime Kernel","Shared Runtime Kernel")],
  [t("AI Product","AI Product"),t("Universal Intelligence Platform","Universal Intelligence Platform")],
  [t("Short-term software","Short-term software"),t("Multi-decade scientific ecosystem","Multi-decade scientific ecosystem")]]
 .map(function(r){return "<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>"}).join("")+"</table>")+
blk(t("Universal Cognitive Pipeline","Universal Cognitive Pipeline"),t("Har laboratory, apni scientific discipline se koi farak nahi padta, isi ek saat-kadam wale cycle ko follow karti hai — human cognition, scientific method aur software engineering se prerit.","Every laboratory, regardless of its scientific discipline, follows this same seven-step cycle — inspired by human cognition, the scientific method, and software engineering."),
 flow([t("Observation","Observation"),t("Reasoning","Reasoning"),t("Planning","Planning"),t("Execution","Execution"),t("Reflection","Reflection"),t("Learning","Learning"),t("Memory","Memory")])+
 '<p class="lead" style="margin-top:12px">'+t("Isi wajah se BRAHMA scale karta hai: naya scientific domain jodne ke liye poora system dobara nahi likhna padta — bas ek nayi laboratory jodni padti hai, jo isi shared cognitive cycle ko use karti hai.","This is why BRAHMA scales: adding a new scientific domain doesn't require rewriting the whole system — just a new laboratory that plugs into the same shared cognitive cycle.")+'</p>')+
blk(t("Under the hood — Tech Foundation","Under the hood — Tech Foundation"),t("Runtime ka technical foundation deliberately simple aur extensible rakha gaya hai.","The runtime's technical foundation is deliberately kept simple and extensible."),
 grid([card(t("Python 3.12 + Streamlit","Python 3.12 + Streamlit"),t("Core runtime Python mein likha gaya hai; Streamlit UI sirf intelligence ko present karta hai, usse rakhta nahi.","The core runtime is written in Python; the Streamlit UI only presents intelligence, it never holds it.")),
 card(t("ChromaDB Vector Memory","ChromaDB Vector Memory"),t("Knowledge aur conversation memory ChromaDB collections mein rehti hai — identity, external knowledge aur conversation memory alag-alag.","Knowledge and conversation memory live in ChromaDB collections — identity, external knowledge, and conversation memory kept separate.")),
 card(t("Dual Intelligence Routing","Dual Intelligence Routing"),t("Runtime online models (jaise Gemini) aur local models (jaise Ollama) donon ke beech route kar sakta hai — flexibility aur offline capability ke liye.","The runtime can route between online models (like Gemini) and local models (like Ollama) — for flexibility and offline capability.")),
 card(t("Manifest-Based Laboratories","Manifest-Based Laboratories"),t("Har laboratory sirf teen files rakhti hai — manifest.py, lab.py, README.md — jo unhe hot-discoverable aur maintainable banata hai.","Every laboratory keeps just three files — manifest.py, lab.py, README.md — making them hot-discoverable and maintainable."))]))+
blk(t("Repository ke folders","Repository folders"),t("Har folder ka apna page hai — asli GitHub structure jaisa hi. Click karke andar ki poori detail dekhein.","Each folder has its own page — mirroring the actual GitHub structure. Click to see the full detail inside."),
 grid(folders.map(function(f){return card(f[1],f[2],{go:f[0]})})))+
blk(t("Development status","Development status"),t("Abhi Runtime Evolution phase — Version 0.1. Ye ek honest, transparent progress-tracker hai, marketing number nahi.","Currently in the Runtime Evolution phase — Version 0.1. This is an honest, transparent progress tracker, not a marketing number."),
 bars.map(function(b){return '<div class="bar">'+b[0]+"<b>"+b[1]+"%</b><div><i style=\"width:"+b[1]+"%\"></i></div></div>"}).join(""))+
blk(t("Aage kya","What's next"),t("BRAHMA ek short-term product launch nahi, ek multi-decade scientific ecosystem ki tarah plan kiya gaya hai.","BRAHMA is planned as a multi-decade scientific ecosystem, not a short-term product launch."),
 flow([t("Universal Runtime","Universal Runtime"),t("Universal Agent","Universal Agent"),t("Scientific Laboratories","Scientific Laboratories"),t("Cross-Laboratory Intelligence","Cross-Laboratory Intelligence"),t("Artificial Scientists","Artificial Scientists"),t("Distributed Intelligence","Distributed Intelligence"),t("Universal Intelligence","Universal Intelligence"),t("Artificial Scientific Civilization","Artificial Scientific Civilization")])+
 '<div style="margin-top:20px"><button class="btn p" onclick="go(\'docs\')">'+t("Poora roadmap dekhein","See the full roadmap")+'</button><button class="btn" onclick="go(\'founder\')">'+t("Founder se miliye","Meet the founder")+'</button></div>');

CONTENT.research=ph("RESEARCH/",t("Research","Research"),t("Yahin har idea janm leta hai. Research hamesha engineering se pehle aati hai — implementation kabhi architecture se aage nahi badhta.","This is where every idea is born. Research always comes before engineering — implementation never gets ahead of architecture."))+
blk(t("Is folder mein","Inside this folder"),t("Scientific soch ko documents aur experiments ki shakal mein rakha jaata hai. Click karke seedha RESEARCH/ folder par jaayein.","Scientific thinking is kept here as documents and experiments. Click to go straight to the RESEARCH/ folder."),
 grid([card(t("Scientific Ideas","Scientific Ideas"),t("Naye concepts, abhi architecture banne se pehle ke stage par.","New concepts, still at the stage before they become architecture."),{href:GH+"/tree/main/RESEARCH"}),
 card(t("Mathematical Models","Mathematical Models"),t("Intelligence ko formal roop dene wale models.","Models that give intelligence a formal shape."),{href:GH+"/tree/main/RESEARCH"}),
 card(t("Hypotheses","Hypotheses"),t("Jinhe experiments se parakhna hai.","Ideas yet to be tested through experiments."),{href:GH+"/tree/main/RESEARCH"}),
 card(t("Papers","Papers"),t("Research documents aur publications.","Research documents and publications."),{href:GH+"/tree/main/RESEARCH"}),
 card(t("Experiments","Experiments"),t("Simulations aur discovery pipelines.","Simulations and discovery pipelines."),{href:GH+"/tree/main/RESEARCH"})]))+
blk(t("Research Laboratory ke focus areas","Research Laboratory's focus areas"),t("ENGINEERING/LABS ke andar.","Inside ENGINEERING/LABS."),
 grid([t("Scientific Experiments","Scientific Experiments"),t("Simulations","Simulations"),t("Publications","Publications"),t("Research Pipelines","Research Pipelines"),t("Discovery Frameworks","Discovery Frameworks")].map(function(x){return card(x,"",{href:GH+"/tree/main/ENGINEERING/LABS"})})))+
blk(t("Repository Evolution — idea ka safar","Repository Evolution — the journey of an idea"),t("Har idea is lifecycle se guzarta hai. Knowledge kabhi koi stage skip nahi karti; kuch bhi discard nahi hota.","Every idea goes through this lifecycle. Knowledge never skips a stage; nothing is ever discarded."),
 flow([t("Research","Research"),t("Engineering","Engineering"),t("BRAHMA Runtime","BRAHMA Runtime"),t("Scientific Laboratories","Scientific Laboratories"),t("Applications","Applications"),t("Public Systems","Public Systems"),t("Archive","Archive")]));

var mods=[["CORE",t("Computational heart: AI abstraction, runtime execution, memory, knowledge systems, vector stores, embeddings, agents.","The computational heart: AI abstraction, runtime execution, memory, knowledge systems, vector stores, embeddings, agents.")],
["CONFIG",t("Runtime settings, model selection, branding, paths, environment.","Runtime settings, model selection, branding, paths, environment.")],
["PROMPTS",t("Reusable prompt architectures: agents, system instructions, templates, RAG, reasoning.","Reusable prompt architectures: agents, system instructions, templates, RAG, reasoning.")],
["SERVICES",t("External integrations: speech, external APIs, Wikipedia, cloud.","External integrations: speech, external APIs, Wikipedia, cloud.")],
["TOOLS",t("Diagnostics, environment validation, development helpers.","Diagnostics, environment validation, development helpers.")],
["UI",t("Streamlit interface aur navigation. UI sirf intelligence dikhata hai, rakhta nahi.","Streamlit interface and navigation. The UI only presents intelligence, it never holds it.")],
["LABS",t("Scientific disciplines — har lab ek independent laboratory.","Scientific disciplines — each lab is an independent laboratory.")],
["RUNTIME",t("Universal runtime: kernel, agent, planning, reflection, learning, memory.","The universal runtime: kernel, agent, planning, reflection, learning, memory.")]];
var ld=[["AI",t("LLMs, ML, deep learning, agentic AI, multi-agent, knowledge systems","LLMs, ML, deep learning, agentic AI, multi-agent systems, knowledge systems"),"Active"],
["Quantum",t("Quantum computing, algorithms, information theory, simulation","Quantum computing, algorithms, information theory, simulation"),""],
["Physics",t("Mechanics, electromagnetism, thermodynamics, relativity, simulation","Mechanics, electromagnetism, thermodynamics, relativity, simulation"),""],
["Biology",t("Computational biology, bioinformatics, systems biology, artificial life","Computational biology, bioinformatics, systems biology, artificial life"),""],
["Cognitive Science",t("Learning, memory, decision making, reasoning, consciousness","Learning, memory, decision making, reasoning, consciousness"),""],

["Research",t("Experiments, simulations, publications, discovery","Experiments, simulations, publications, discovery"),""]];
CONTENT.engineering=ph("ENGINEERING/",t("Engineering","Engineering"),t("Engineering scientific knowledge ko chalne wali intelligence mein badalti hai. Ye layer jaan-bujhkar reusable infrastructure ki tarah design ki gayi hai, application-specific code nahi.","Engineering turns scientific knowledge into running intelligence. This layer is deliberately designed as reusable infrastructure, not application-specific code."))+
blk(t("Modules","Modules"),t("Har module ki ek tay zimmedari hai. Click karke seedha uske GitHub folder par jaayein.","Each module has one defined responsibility. Click to go straight to its GitHub folder."),
 grid(mods.map(function(m){return card(m[0],m[1],{code:"ENGINEERING/"+m[0]+"/",href:GH+"/tree/main/ENGINEERING/"+m[0]})})))+
blk(t("Universal Cognitive Pipeline","Universal Cognitive Pipeline"),t("Poori intelligence Project BRAHMA mein isi ek cycle ko follow karti hai — human cognition, scientific research, software engineering aur biological evolution se prerit.","All intelligence in Project BRAHMA follows this same cycle — inspired by human cognition, scientific research, software engineering, and biological evolution."),

var CONTENT={}, app=document.getElementById("app"), nav=document.getElementById("navlinks");
var CURRENT="home";

function renderNav(){
 nav.innerHTML=PAGES.map(function(p){return '<button data-p="'+p[0]+'">'+p[1][LANG]+"</button>"}).join("");
 nav.querySelectorAll("button").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-p"))}});
 document.querySelectorAll("#langsw button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-l")===LANG)});
 document.getElementById("footline").innerHTML="Project BRAHMA v0.1 · MIT License · "+t("Built in India by","Built in India by")+" Ramendra Singh Rajput · <a href=\""+GH+"\" target=\"_blank\" rel=\"noopener\">GitHub</a>";
 document.documentElement.lang=LANG;
}
function renderPages(){
 CONTENT=buildContent();
 app.innerHTML="";
 PAGES.forEach(function(p){var d=document.createElement("div");d.className="page";d.id="pg-"+p[0];d.innerHTML=CONTENT[p[0]];app.appendChild(d)});
 nav.querySelectorAll("button").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-p"))}});
 initMandala();
}
function go(id){if(!CONTENT[id])id="home";CURRENT=id;
 document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("on",p.id=="pg-"+id)});
 document.querySelectorAll("nav .links button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-p")==id)});
 if(location.hash!=="#"+id)history.pushState(null,"","#"+id);
 window.scrollTo({top:0,behavior:"instant"});
}
function setLang(l){LANG=l;localStorage.setItem("brahma_lang",l);renderNav();renderPages();go(CURRENT);}
document.querySelectorAll("#langsw button").forEach(function(b){b.onclick=function(){setLang(b.getAttribute("data-l"))}});

window.addEventListener("popstate",function(){go(location.hash.slice(1)||"home")});

 var S=[[t("Observation","Observation"),t("Data ya sawaal se jaankari lena.","Gathering information from data or a query.")],
 [t("Reasoning","Reasoning"),t("Context samajhkar nishkarsh nikalna.","Understanding context and drawing conclusions.")],
 [t("Planning","Planning"),t("Lakshya ke kadam tay karna.","Deciding the steps toward a goal.")],
 [t("Execution","Execution"),t("Plan ko tools aur agents se chalana.","Running the plan via tools and agents.")],
 [t("Reflection","Reflection"),t("Natija dekhkar kaam parakhna.","Evaluating the outcome of the work.")],
 [t("Learning","Learning"),t("Reflection se sudhaar seekhna.","Learning improvements from reflection.")],
 [t("Memory","Memory"),t("Seekha hua agle cycle ke liye yaad rakhna.","Remembering what was learned for the next cycle.")]];
 var m=document.getElementById("m"),st=document.getElementById("stage");
 if(!m||!st)return;
 m.innerHTML='<circle class="ring" cx="200" cy="200" r="150"/><circle class="ring" cx="200" cy="200" r="100" stroke-dasharray="3 6"/><text x="200" y="208" text-anchor="middle" style="font:34px \'Tiro Devanagari Hindi\',serif;fill:var(--gold)">ॐ</text>';
 var ns=[],cur=0;
 S.forEach(function(s,i){var a=-Math.PI/2+i*2*Math.PI/7,x=200+150*Math.cos(a),y=200+150*Math.sin(a),g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","node");g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",s[0]);
  g.innerHTML='<circle cx="'+x+'" cy="'+y+'" r="27"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle">'+s[0].slice(0,5)+'.</text>';
  g.onclick=function(){clearInterval(mandalaTimer);pick(i)};g.onkeydown=function(e){if(e.key=="Enter"){clearInterval(mandalaTimer);pick(i)}};
  m.appendChild(g);ns.push(g)});
 function pick(i){cur=i;ns.forEach(function(n,j){n.classList.toggle("on",j==i)});st.innerHTML="<h3>"+S[i][0]+"</h3><p>"+S[i][1]+"</p>"}
 pick(0);
 clearInterval(mandalaTimer);
 if(!matchMedia("(prefers-reduced-motion: reduce)").matches)mandalaTimer=setInterval(function(){pick((cur+1)%7)},2600);
}

go(location.hash.slice(1)||"home");
