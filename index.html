<style>

var app=document.getElementById("app"),nav=document.getElementById("navlinks");
nav.innerHTML=PAGES.map(function(p){return '<button data-p="'+p[0]+'" onclick="go(\''+p[0]+'\')">'+p[1]+"</button>"}).join("");
PAGES.forEach(function(p){var d=document.createElement("div");d.className="page";d.id="pg-"+p[0];d.innerHTML=CONTENT[p[0]];app.appendChild(d)});
function go(id){if(!CONTENT[id])id="home";
 document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("on",p.id=="pg-"+id)});
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-p")==id)});
 if(location.hash!=="#"+id)history.pushState(null,"","#"+id);
 window.scrollTo({top:0,behavior:"instant"});
}
window.addEventListener("popstate",function(){go(location.hash.slice(1)||"home")});

var S=[["Observation","Data ya sawaal se jaankari lena."],["Reasoning","Context samajhkar nishkarsh nikalna."],["Planning","Lakshya ke kadam tay karna."],["Execution","Plan ko tools aur agents se chalana."],["Reflection","Natija dekhkar kaam parakhna."],["Learning","Reflection se sudhaar seekhna."],["Memory","Seekha hua agle cycle ke liye yaad rakhna."]];
var m=document.getElementById("m"),st=document.getElementById("stage"),ns=[],cur=0,tm;
S.forEach(function(s,i){var a=-Math.PI/2+i*2*Math.PI/7,x=200+150*Math.cos(a),y=200+150*Math.sin(a),g=document.createElementNS("http://www.w3.org/2000/svg","g");
 g.setAttribute("class","node");g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",s[0]);
 g.innerHTML='<circle cx="'+x+'" cy="'+y+'" r="27"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle">'+s[0].slice(0,5)+'.</text>';
 g.onclick=function(){clearInterval(tm);pick(i)};g.onkeydown=function(e){if(e.key=="Enter"){clearInterval(tm);pick(i)}};
 m.appendChild(g);ns.push(g)});

pick(0);
